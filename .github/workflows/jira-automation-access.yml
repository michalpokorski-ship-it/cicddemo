name: Jira Automation API access test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jira-automation-access.yml'
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
    steps:
      - name: Read-only Automation API probe
        run: |
          python3 - <<'PY'
          import os, base64, json, urllib.request, urllib.error
          email, token = os.environ.get("JIRA_EMAIL"), os.environ.get("JIRA_API_TOKEN")
          if not email or not token:
              raise SystemExit("Required secret missing")
          url = "https://api.atlassian.com/automation/public/jira/4036b126-1d24-4aec-911a-d958aa2b1942/rest/v1/rule/summary?limit=1"
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args):
                  return None
          opener = urllib.request.build_opener(NoRedirect())
          auth = base64.b64encode((email + ":" + token).encode()).decode()
          req = urllib.request.Request(url, headers={"Authorization": "Basic " + auth, "Accept": "application/json"})
          try:
              with opener.open(req, timeout=20) as response:
                  data = json.load(response)
                  if not isinstance(data.get("data"), list):
                      raise SystemExit("Unexpected response schema")
                  print("Automation API read: HTTP 200")
          except urllib.error.HTTPError as e:
              raise SystemExit("Automation API read: HTTP " + str(e.code))
          PY
