name: Initialize UAT environment
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/setup-uat.yml'
permissions: {}
jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment:
      name: UAT
      deployment: false
    steps:
      - run: echo 'UAT environment initialized; no application deployment performed'
